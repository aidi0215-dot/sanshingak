<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오행전설 - 디지털 산신각</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .menu-btn {
            display: block;
            background: rgba(0, 0, 0, 0.6);
            color: #ffcc00;
            border: 1px solid #555;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            margin-bottom: 12px;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        .menu-btn:hover {
            background: rgba(255, 204, 0, 0.15);
            border-color: #ffcc00;
            transform: translateY(-2px);
        }
        /* 유튜브 바로가기 버튼 스타일 (붉은색 포인트) */
        .youtube-btn {
            display: block;
            margin-top: 20px;
            background: #c0392b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .youtube-btn:hover {
            background: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>오행전설 : 디지털 산신각</h1>
    <div class="subtitle">황토고원 절벽 틈새<br>참배와 정화가 이루어지는 성스러운 공간</div>

    <!-- 메뉴 버튼들 -->
    <a href="fortune.html" class="menu-btn">🔮 오늘의 띠별 운세 보기</a>
    
    <!-- 🌟 새로 추가된 오행 수호신 & 60갑자 성격 테스트 버튼 (파일명이 mbti.html일 경우) -->
    <a href="mbti.html" class="menu-btn" style="color: #2ecc71; border-color: #27ae60;">✨ 나의 운명 수호환수 찾기 (성격 테스트)</a>

    <a href="incense.html" class="menu-btn">🕯️ 산신 제단에 향 피우기</a>
    <a href="meditation.html" class="menu-btn" style="color: #3498db; border-color: #2471a3;">🧘‍♂️ 고요한 명상의 방 들어가기</a>
    <a href="tiger.html" class="menu-btn" style="color: #e74c3c; border-color: #8a2c20;">🐅 호랑이 기운으로 탁기 걷어내기</a>

    <!-- 유튜브 채널 링크 버튼 -->
    <a href="https://youtube.com/channel/UC19D_0wmj0BeSgRG3vdMsoQ?si=ITEjSQO4zB1uTexU" target="_blank" class="youtube-btn">📺 작가 유튜브 채널 방문하기</a>
</div>

</html>
