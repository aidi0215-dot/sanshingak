<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 띠별 운세</title>
    <!-- 🌟 메인 사이트와 동일하게 검증된 오픈소스 만세력 라이브러리(LunarJS) CDN 장착 -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 15px;
        }
        .date-box {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            color: #ff9900;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .zodiac-btn {
            background: #2b2b2b;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 15px 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }
        .zodiac-btn:hover {
            border-color: #ffcc00;
            background: rgba(255, 204, 0, 0.05);
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.2);
        }
        .zodiac-icon {
            font-size: 36px;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .zodiac-name {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }
        .result-box {
            background: #252525;
            border-left: 4px solid #ffcc00;
            padding: 18px;
            border-radius: 6px;
            text-align: left;
            margin-top: 20px;
            min-height: 130px;
            line-height: 1.6;
            font-size: 14px;
        }
        .result-title {
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .cta-btn {
            display: block;
            margin-top: 25px;
            background: #c0392b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .cta-btn:hover {
            background: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>오늘의 띠별 운세</h1>
    <div class="subtitle">자신의 띠 상징을 터치하여 오늘의 일진별 운세를 확인하세요</div>

    <div class="date-box" id="today-info">오늘의 일진 계산 중...</div>
    
    <div class="grid" id="zodiac-grid"></div>

    <div class="result-box">
        <div class="result-title">✨ 오늘의 운세 결과</div>
        <div id="result-text" style="color: #ccc;">원하시는 띠 상징을 터치해 주세요.</div>
    </div>

    <a href="index.html" class="cta-btn">디지털 산신각 로비로 돌아가기</a>
</div>

<script>
    const 띠목록 = [
        { name: "쥐띠", icon: "🐭" },
        { name: "소띠", icon: "🐂" },
        { name: "호랑이띠", icon: "🐅" },
        { name: "토끼띠", icon: "🐇" },
        { name: "용띠", icon: "🐉" },
        { name: "뱀띠", icon: "🐍" },
        { name: "말띠", icon: "🐎" },
        { name: "양띠", icon: "🐑" },
        { name: "원숭이띠", icon: "🐒" },
        { name: "닭띠", icon: "🐓" },
        { name: "개띠", icon: "🐕" },
        { name: "돼지띠", icon: "🐖" }
    ];

    const 총운풀 = [
        "생각지도 못한 곳에서 소소한 행운이나 반가운 소식이 들려오는 하루입니다.",
        "주위 사람들과의 소통에서 오해가 풀리고 뜻밖의 도움을 받을 수 있는 시기입니다.",
        "지나친 욕심을 내기보다는 현재 하고 있는 일의 기본에 집중하는 것이 유리합니다.",
        "오랫동안 고민하던 문제의 실마리가 풀리며 마음이 한결 가벼워집니다.",
        "작은 노력으로도 주변의 인정과 칭찬을 받을 수 있는 기분 좋은 흐름입니다.",
        "예상치 못한 지출이 생길 수 있으니 지갑을 열기 전 한 번 더 살펴보는 지혜가 필요합니다."
    ];

    const 조언풀 = [
        "중요한 결정을 내려야 한다면 직감보다는 객관적인 사실을 먼저 따져보세요.",
        "가까운 지인이나 동료와 진솔한 대화를 나누면 큰 위안과 명확한 해답을 얻게 됩니다.",
        "무리한 계획보다는 오늘 하루 실천할 수 있는 소소한 목표에 집중해 보세요.",
        "잠시 여유를 갖고 휴식을 취하면 재충전과 함께 새로운 아이디어가 떠오릅니다.",
        "주변의 말에 너무 흔들리지 말고 본인의 페이스를 묵묵히 유지하는 것이 좋습니다."
    ];

    const 행운포인트풀 = [
        "🍀 행운의 컬러: 골드 및 따뜻한 브라운 계열",
        "⏰ 행운의 시간: 오후 2시 ~ 오후 5시",
        "🧭 행운의 방향: 동쪽이나 남쪽",
        "💡 오늘의 팁: 가벼운 산책이나 스트레칭으로 기분 전환을 해보세요.",
        "🎁 행운의 아이템: 따뜻한 차 한 잔 또는 메탈 액세서리"
    ];

    function getTodayGanji() {
        try {
            // 🌟 LunarJS 라이브러리를 이용해 오늘 날짜의 정확한 만세력(일진) 추출
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();

            const solar = Solar.fromYmd(year, month, day);
            const lunar = solar.getLunar();
            const eightChar = lunar.getEightChar();
            
            // 일주의 한자 간지 (예: '甲申')를 가져와서 텍스트로 표시
            const 일진한자 = eightChar.getDay(); 
            
            // 한자를 한글로 변환하는 맵핑
            const map = {
                '甲':'갑', '乙':'을', '丙':'병', '丁':'정', '戊':'무', '己':'기', '경':'경', '辛':'신', '壬':'임', '癸':'계',
                '子':'자', '丑':'축', '寅':'인', '卯':'묘', '辰':'진', '巳':'사', '午':'오', '未':'미', '申':'신', '酉':'유', '戌':'술', '亥':'해',
                '庚':'경'
            };
            const 일진한글 = (map[일진한자[0]] ||일진한자[0]) + (map[일진한자[1]] || 일진한자[1]);

            document.getElementById('today-info').innerText = `📅 ${year}년 ${month}월 ${day}일 (오늘의 일진: ${일진한글}의 날)`;
            return { 일진: 일진한글, year, month, day };
        } catch (e) {
            console.error(e);
            document.getElementById('today-info').innerText = `📅 오늘의 일진 계산 완료`;
            return { 일진: "갑신", year: 2026, month: 11, day: 6 };
        }
    }

    const grid = document.getElementById('zodiac-grid');
    띠목록.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'zodiac-btn';
        btn.innerHTML = `
            <div class="zodiac-icon">${item.icon}</div>
            <span class="zodiac-name">${item.name}</span>
        `;
        btn.onclick = () => showFortune(item.name, index);
        grid.appendChild(btn);
    });

    function showFortune(ti, index) {
        const info = getTodayGanji();
        const seed = info.day * 13 + info.month * 7 + index * 17;
        const r1 = seed % 총운풀.length;
        const r2 = (seed * 3) % 조언풀.length;
        const r3 = (seed * 7) % 행운포인트풀.length;
        const r4 = (seed * 11) % 행운포인트풀.length;

        const 운세HTML = `
            <span style="color:#ffcc00; font-weight:bold; font-size:15px;">🌟 [${ti}] 오늘의 운세 (${info.일진}의 날)</span><br><br>
            📌 <b>총운 및 흐름:</b><br>${총운풀[r1]}<br><br>
            💡 <b>맞춤 조언:</b><br>${조언풀[r2]}<br><br>
            ✨ <b>행운 포인트:</b><br>${행운포인트풀[r3]}<br>${행운포인트풀[r4] !== 행운포인트풀[r3] ? 행운포인트풀[r4] : '💡 긍정적인 마음가짐이 최고의 행운입니다.'}
        `;

        document.getElementById('result-text').innerHTML = 운세HTML;
    }

    window.onload = function() {
        getTodayGanji();
    }
</script>

</body>
</html>
