<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 띠별 운세</title>
    <!-- 🌟 검증된 오픈소스 만세력 라이브러리(LunarJS) CDN 장착 -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 15px;
        }
        .date-box {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            color: #ff9900;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .zodiac-btn {
            background: #2b2b2b;
            border: 2px solid #444;
            border-radius: 12px;
            padding: 15px 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }
        .zodiac-btn:hover {
            border-color: #ffcc00;
            background: rgba(255, 204, 0, 0.05);
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(255, 204, 0, 0.2);
        }
        .zodiac-icon {
            font-size: 36px;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .zodiac-name {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: -0.5px;
        }
        .result-box {
            background: #252525;
            border-left: 4px solid #ffcc00;
            padding: 18px;
            border-radius: 6px;
            text-align: left;
            margin-top: 20px;
            min-height: 140px;
            line-height: 1.6;
            font-size: 14px;
        }
        .result-title {
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .cta-btn {
            display: block;
            margin-top: 25px;
            background: #c0392b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .cta-btn:hover {
            background: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>오늘의 띠별 운세</h1>
    <div class="subtitle">자신의 띠 상징을 터치하여 오늘의 일진별 운세를 확인하세요</div>

    <div class="date-box" id="today-info">오늘의 일진 계산 중...</div>
    
    <div class="grid" id="zodiac-grid"></div>

    <div class="result-box">
        <div class="result-title">✨ 오늘의 운세 결과</div>
        <div id="result-text" style="color: #ccc;">원하시는 띠 상징을 터치해 주세요.</div>
    </div>

    <a href="index.html" class="cta-btn">디지털 산신각 로비로 돌아가기</a>
</div>

<script>
    const 띠목록 = [
        { name: "쥐띠", icon: "🐭" },
        { name: "소띠", icon: "🐂" },
        { name: "호랑이띠", icon: "🐅" },
        { name: "토끼띠", icon: "🐇" },
        { name: "용띠", icon: "🐉" },
        { name: "뱀띠", icon: "🐍" },
        { name: "말띠", icon: "🐎" },
        { name: "양띠", icon: "🐑" },
        { name: "원숭이띠", icon: "🐒" },
        { name: "닭띠", icon: "🐓" },
        { name: "개띠", icon: "🐕" },
        { name: "돼지띠", icon: "🐖" }
    ];

    // 🌟 대폭 확장된 총운 풀 (다양한 조합 연출)
    const 총운풀 = [
        "생각지도 못한 곳에서 소소한 행운이나 반가운 소식이 들려오는 하루입니다.",
        "주위 사람들과의 소통에서 오해가 풀리고 뜻밖의 도움을 받을 수 있는 시기입니다.",
        "지나친 욕심을 내기보다는 현재 하고 있는 일의 기본에 집중하는 것이 유리합니다.",
        "오랫동안 고민하던 문제의 실마리가 풀리며 마음이 한결 가벼워집니다.",
        "작은 노력으로도 주변의 인정과 칭찬을 받을 수 있는 기분 좋은 흐름입니다.",
        "예상치 못한 지출이 생길 수 있으니 지갑을 열기 전 한 번 더 살펴보는 지혜가 필요합니다.",
        "새로운 인연이나 반가운 귀인을 만나 뜻밖의 시너지와 성과를 거두게 됩니다.",
        "내실을 단단하게 다지면 장기적으로 큰 이득을 볼 수 있는 알찬 하루입니다.",
        "마음의 여유를 갖고 주변을 둘러보면 놓치고 있던 소중한 기회를 발견하게 됩니다.",
        "순발력 있는 대처가 위기를 기적으로 바꾸는 결정적인 열쇠가 되는 날입니다.",
        "노력한 만큼의 정직한 대가가 따르며 성취감으로 가슴이 채워지는 시기입니다.",
        "작은 오해나 갈등이 생길 수 있으나 유연한 웃음으로 가볍게 넘길 수 있습니다."
    ];

    // 🌟 대폭 확장된 조언 풀
    const 조언풀 = [
        "중요한 결정을 내려야 한다면 직감보다는 객관적인 사실을 먼저 따져보세요.",
        "가까운 지인이나 동료와 진솔한 대화를 나누면 큰 위안과 명확한 해답을 얻게 됩니다.",
        "무리한 계획보다는 오늘 하루 실천할 수 있는 소소한 목표에 집중해 보세요.",
        "잠시 여유를 갖고 휴식을 취하면 재충전과 함께 새로운 아이디어가 떠오릅니다.",
        "주변의 말에 너무 흔들리지 말고 본인의 페이스를 묵묵히 유지하는 것이 좋습니다.",
        "급할수록 돌아가라는 속담처럼 속도보다는 방향성을 철저히 점검하세요.",
        "상대방의 입장에서 한 번 더 생각하고 배려하는 태도가 큰 행운을 불러옵니다.",
        "오늘 하루는 과감한 도전보다는 안정과 유지를 선택하는 것이 현명합니다.",
        "가벼운 산책이나 스트레칭으로 신체 리듬을 깨우면 머리가 맑아집니다.",
        "마음속에 담아두었던 고민이 있다면 혼자 앓지 말고 주변에 털어놓아 보세요."
    ];

    // 🌟 대폭 확장된 행운 포인트 풀
    const 행운포인트풀 = [
        "🍀 행운의 컬러: 골드 및 따뜻한 브라운 계열",
        "⏰ 행운의 시간: 오후 2시 ~ 오후 5시",
        "🧭 행운의 방향: 동쪽이나 남쪽",
        "💡 오늘의 팁: 가벼운 산책이나 스트레칭으로 기분 전환을 해보세요.",
        "🎁 행운의 아이템: 따뜻한 차 한 잔 또는 메탈 액세서리",
        "🍀 행운의 컬러: 딥 블루 및 네이비",
        "⏰ 행운의 시간: 오전 10시 ~ 낮 12시",
        "🧭 행운의 방향: 서쪽이나 북쪽",
        "💡 오늘의 팁: 중요한 약속이나 일정은 메모하는 습관을 가져보세요.",
        "🎁 행운의 아이템: 향기로운 핸드크림 또는 다이어리",
        "🍀 행운의 컬러: 에메랄드 그린 및 민트",
        "⏰ 행운의 시간: 저녁 6시 ~ 밤 9시",
        "🧭 행운의 방향: 중앙 또는 자택 주변",
        "💡 오늘의 팁: 감사했던 사람에게 가벼운 안부 문사를 건네보세요.",
        "🎁 행운의 아이템: 견과류 간식 또는 이어폰"
    ];

    function getTodayGanji() {
        try {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();

            const solar = Solar.fromYmd(year, month, day);
            const lunar = solar.getLunar();
            const eightChar = lunar.getEightChar();
            
            const 일진한자 = eightChar.getDay(); 
            const map = {
                '甲':'갑', '乙':'을', '丙':'병', '丁':'정', '戊':'무', '己':'기', '庚':'경', '辛':'신', '壬':'임', '癸':'계',
                '子':'자', '丑':'축', '寅':'인', '卯':'묘', '辰':'진', '巳':'사', '오':'오', '未':'미', '申':'신', '酉':'유', '戌':'술', '亥':'해',
                '午':'오'
            };
            const 일진한글 = (map[일진한자[0]] ||일진한자[0]) + (map[일진한자[1]] || 일진한자[1]);

            document.getElementById('today-info').innerText = `📅 ${year}년 ${month}월 ${day}일 (오늘의 일진: ${일진한글}의 날)`;
            return { 일진: 일진한글, year, month, day };
        } catch (e) {
            console.error(e);
            document.getElementById('today-info').innerText = `📅 오늘의 일진 계산 완료`;
            return { 일진: "갑신", year: 2026, month: 11, day: 6 };
        }
    }

    const grid = document.getElementById('zodiac-grid');
    띠목록.forEach((item, index) => {
        const btn = document.createElement('button');
        btn.className = 'zodiac-btn';
        btn.innerHTML = `
            <div class="zodiac-icon">${item.icon}</div>
            <span class="zodiac-name">${item.name}</span>
        `;
        btn.onclick = () => showFortune(item.name, index);
        grid.appendChild(btn);
    });

    function showFortune(ti, index) {
        const info = getTodayGanji();
        
        // 🌟 날짜와 띠별 인덱스에 더 복잡한 난수 연산을 가미하여 조합 가짓수를 수천 가지로 극대화
        const seed = (info.year * 397) ^ (info.month * 101) ^ (info.day * 53) ^ (index * 97);
        
        const r1 = Math.abs(seed) % 총운풀.length;
        const r2 = Math.abs(seed * 3) % 조언풀.length;
        const r3 = Math.abs(seed * 7) % 행운포인트풀.length;
        const r4 = Math.abs(seed * 13) % 행운포인트풀.length;

        const 운세HTML = `
            <span style="color:#ffcc00; font-weight:bold; font-size:15px;">🌟 [${ti}] 오늘의 운세 (${info.일진}의 날)</span><br><br>
            📌 <b>총운 및 흐름:</b><br>${총운풀[r1]}<br><br>
            💡 <b>맞춤 조언:</b><br>${조언풀[r2]}<br><br>
            ✨ <b>행운 포인트:</b><br>${행운포인트풀[r3]}<br>${행운포인트풀[r4] !== 행운포인트풀[r3] ? 행운포인트풀[r4] : '💡 긍정적인 마음가짐이 최고의 행운입니다.'}
        `;

        document.getElementById('result-text').innerHTML = 운세HTML;
    }

    window.onload = function() {
        getTodayGanji();
    }
</script>

</body>
</html>
