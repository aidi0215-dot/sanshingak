<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오행전설 - 디지털 산신각 향 피우기</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        h1 {
            color: #ffcc00;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }
        .altar-box {
            position: relative;
            width: 100%;
            height: 240px;
            background: linear-gradient(to bottom, #1c1815, #0a0807);
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .altar-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .action-btn {
            background: #d35400;
            color: white;
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.4);
            margin-bottom: 20px;
        }
        .action-btn:hover {
            background: #e67e22;
        }
        .action-btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }
        .result-box {
            background: #222;
            border-left: 4px solid #ffcc00;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            min-height: 120px;
            line-height: 1.6;
            font-size: 14px;
        }
        .result-title {
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .cta-btn {
            display: block;
            margin-top: 20px;
            background: #c0392b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .cta-btn:hover {
            background: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>오행전설 : 디지털 산신각</h1>
    <div class="subtitle">황토고원 절벽 틈새, 정성스레 향을 피우는 공간</div>

    <!-- 제단 영역 (처음엔 멈춰있고 버튼을 눌러야 재생됨) -->
    <div class="altar-box" id="altar-container">
        <video id="altar-video" muted playsinline>
            <source src="altar.mp4" type="video/mp4">
            동영상을 지원하지 않는 브라우저입니다.
        </video>
    </div>

    <!-- 향 피우기 액션 버튼 -->
    <button class="action-btn" id="incense-btn" onclick="burnIncense()">산신 제단에 향 피우기 올리기</button>

    <!-- 결과 출력 영역 (덕담) -->
    <div class="result-box" id="result-area">
        <div class="result-title">산신할아버지의 공수</div>
        <div id="result-text">제단 앞에 정좌하고 향을 피워 올리면 산신의 깊은 말씀이 강림합니다.</div>
    </div>

    <!-- 작가님 유튜브 채널 연결 버튼 -->
    <a href="https://youtube.com/channel/UC19D_0wmj0BeSgRG3vdMsoQ?si=1UrtgWGpSbSWyVum" target="_blank" class="cta-btn">이 기운을 품고 전설 속으로 가기 (YouTube)</a>
</div>

<script>
    const 덕담도입부 = [
        "깊은 산속 안개를 뚫고 찾아왔구나.",
        "탁한 기운을 걷어내고 정갈한 마음으로 제단에 섰으니,",
        "사방이 꽉 막힌 황토고원의 바람 속에서도,",
        "네가 지닌 그릇의 크기가 비로소 빛을 발할 때가 되었느니라."
    ];

    const 덕담본문 = [
        "지나간 낡은 집착은 과감히 끊어내고 새로운 판을 짜도록 하라.",
        "조급해하지 말고 깊은 물처럼 속을 채우며 때를 기다려라.",
        "남들이 가지 않는 험준한 길일지라도 네가 디디는 곳이 곧 길이 되리니,",
        "흐트러진 집중을 바로잡고 네 안의 날카로운 결단을 믿어라."
    ];

    const 덕담결말 = [
        "머지않아 구름이 걷히고 거대한 태양이 네 앞길을 비출 것이다.",
        "호랑이의 기운이 네 등 뒤를 지킬 터이니 거침없이 나아가라.",
        "오늘 흘린 진지한 노력이 마침내 전설의 서사를 완성할 페달이 되리라.",
        "산신의 가호가 항상 너와 함께할지니, 결코 흔들리지 말라."
    ];

    function burnIncense() {
        const btn = document.getElementById('incense-btn');
        const resultText = document.getElementById('result-text');
        const video = document.getElementById('altar-video');
        
        btn.disabled = true;
        btn.innerText = "향이 타오르며 산신의 기운이 모이는 중...";

        // 버튼을 누르는 순간 영상을 처음부터 재생!
        video.currentTime = 0;
        video.play();

        // 1.5초 뒤에 무한 조합 덕담 텍스트 띄우기
        setTimeout(() => {
            const now = new Date();
            const seed = now.getTime();
            
            const r1 = seed % 덕담도입부.length;
            const r2 = Math.floor(seed / 7) % 덕담본문.length;
            const r3 = Math.floor(seed / 13) % 덕담결말.length;

            const 조합된덕담 = `${덕담도입부[r1]}<br><br>${덕담본문[r2]}<br><br>${덕담결말[r3]}`;

            resultText.innerHTML = `<span style="color:#ff9900; font-weight:bold;">[향이 타오른 자리의 공수]</span><br><br>${조합된덕담}`;
            
            btn.innerText = "참배 완료 (다시 하려면 새로고침)";
        }, 1500);
    }
</script>

</body>
</html>
