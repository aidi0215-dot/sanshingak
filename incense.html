<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오행전설 - 디지털 산신각 부적 참배</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        h1 {
            color: #ffcc00;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }
        .altar-box {
            position: relative;
            width: 100%;
            height: 240px;
            background: linear-gradient(to bottom, #1c1815, #0a0807);
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .altar-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .action-btn {
            background: #d35400;
            color: white;
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.4);
            margin-bottom: 20px;
        }
        .action-btn:hover {
            background: #e67e22;
        }
        .action-btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }
        /* 오행 부적 카드 스타일 */
        .talisman-card {
            background: linear-gradient(135deg, #2b1d0c, #141414);
            border: 2px solid #ffcc00;
            border-radius: 8px;
            padding: 20px;
            text-align: left;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
            display: none;
        }
        .talisman-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed #444;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }
        .talisman-element {
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
        }
        .talisman-badge {
            font-size: 12px;
            background: #333;
            color: #aaa;
            padding: 3px 8px;
            border-radius: 4px;
        }
        .result-text {
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
        }
        .cta-btn {
            display: block;
            margin-top: 25px;
            background: #c0392b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .cta-btn:hover {
            background: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>오행전설 : 디지털 산신각</h1>
    <div class="subtitle">황토고원 절벽 틈새, 정성스레 향을 피우는 공간</div>

    <!-- 제단 영역 -->
    <div class="altar-box" id="altar-container">
        <video id="altar-video" muted playsinline>
            <source src="altar.mp4" type="video/mp4">
            동영상을 지원하지 않는 브라우저입니다.
        </video>
    </div>

    <!-- 향 피우기 액션 버튼 -->
    <button class="action-btn" id="incense-btn" onclick="burnIncense()">산신 제단에 향 피우기 올리기</button>

    <!-- 오행 부적 카드 결과 영역 -->
    <div class="talisman-card" id="talisman-card">
        <div class="talisman-header">
            <span class="talisman-element" id="talisman-title">✨ 오늘의 오행 부적</span>
            <span class="talisman-badge" id="talisman-subtitle">산신의 공수</span>
        </div>
        <div class="result-text" id="result-text">
            제단 앞에 정좌하고 향을 피워 올리면 산신의 깊은 말씀이 강림합니다.
        </div>
    </div>

    <!-- 작가님 유튜브 채널 연결 버튼 -->
    <a href="https://youtube.com/channel/UC19D_0wmj0BeSgRG3vdMsoQ?si=1UrtgWGpSbSWyVum" target="_blank" class="cta-btn">이 기운을 품고 전설 속으로 가기 (YouTube)</a>
</div>

<script>
    const 오행종류 = [
        { name: "🔥 화(火)의 불꽃 부적", tag: "열정과 결단" },
        { name: "⚔️ 금(金)의 쇳소리 부적", tag: "단호한 끊어냄" },
        { name: "🌲 목(木)의 생명력 부적", tag: "성장과 비상" },
        { name: "🌊 수(水)의 깊은 물 부적", tag: "지혜와 내실" },
        { name: "⛰️ 토(土)의 황토고원 부적", tag: "중심과 묵직한 기운" }
    ];

    const 덕담도입부 = [
        "깊은 산속 자욱한 안개를 뚫고 마침내 이곳에 닿았구나.",
        "탁한 기운을 깊이 털어내고 정갈한 마음으로 제단에 섰으니,",
        "사방이 꽉 막힌 황토고원의 매서운 칼바람 속에서도,",
        "네가 품은 그릇의 깊이가 비로소 빛을 발할 때가 되었느니라.",
        "칠흑 같은 밤을 건너와 백색 영물의 울음소리를 듣고 찾아왔으니,",
        "흐트러진 호흡을 가다듬고 오행의 기운을 온전히 받아들일 지어다."
    ];

    const 덕담본문 = [
        "지나간 낡은 집착과 미련은 과감하게 끊어내고 완전히 새로운 판을 짜도록 하라.",
        "조급하게 마음을 먹지 말고 깊은 우물물처럼 속을 차분히 채우며 때를 기다려라.",
        "남들이 가지 않는 험준한 황무지일지라도 네가 디디는 그 발걸음이 곧 길이 되리라.",
        "흐트러진 집중을 단단히 바로잡고 네 안의 날카로운 결단과 직관을 믿어라.",
        "주변의 헛된 소음에 귀를 닫고 네가 걸어가는 서사의 중심을 굳건히 지켜라."
    ];

    const 덕담결말 = [
        "머지않아 구름이 걷히고 거대한 태양이 네 앞길을 찬란하게 비출 것이다.",
        "호랑이의 맹렬한 기운이 네 등 뒤를 든든히 지킬 터이니 거침없이 나아가라.",
        "오늘 흘린 진지한 노력이 마침내 네가 그려온 전설의 서사를 완성할 페달이 되리라.",
        "산신의 가호가 언제나 너와 함께할지니, 어떤 시련이 와도 결코 흔들리지 말라.",
        "막혀 있던 운의 흐름이 순풍을 만난 듯 거침없이 트이며 비상하기 시작하리라."
    ];

    function burnIncense() {
        const btn = document.getElementById('incense-btn');
        const talismanCard = document.getElementById('talisman-card');
        const resultText = document.getElementById('result-text');
        const talismanTitle = document.getElementById('talisman-title');
        const talismanSubtitle = document.getElementById('talisman-subtitle');
        const video = document.getElementById('altar-video');
        
        btn.disabled = true;
        btn.innerText = "향이 타오르며 산신의 기운이 모이는 중...";

        // 제단 비디오 재생
        video.currentTime = 0;
        video.play();

        // 2초 동안 몰입감을 주는 로딩 연출 후 부적 카드 팡! 하고 등장
        setTimeout(() => {
            const now = new Date();
            const seed = now.getTime() + Math.floor(Math.random() * 10000);
            
            const elementIndex = seed % 오행종류.length;
            const r1 = seed % 덕담도입부.length;
            const r2 = Math.floor(seed / 7) % 덕담본문.length;
            const r3 = Math.floor(seed / 13) % 덕담결말.length;

            const selectedElement = 오행종류[elementIndex];
            const 조합된덕담 = `${덕담도입부[r1]}<br><br>${덕담본문[r2]}<br><br>${덕담결말[r3]}`;

            // 부적 카드 내용 주입
            talismanTitle.innerText = selectedElement.name;
            talismanSubtitle.innerText = selectedElement.tag;
            resultText.innerHTML = 조합된덕담;

            // 부적 카드 부드럽게 노출
            talismanCard.style.display = "block";
            
            btn.innerText = "참배 완료 (다시 하려면 새로고침)";
        }, 2000);
    }
</script>

</body>
</html>
