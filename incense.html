<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오행전설 - 디지털 산신각 향 피우기</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Malgun Gothic', sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
        }
        h1 {
            color: #ffcc00;
            font-size: 20px;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }
        .altar-box {
            position: relative;
            width: 100%;
            height: 240px;
            background: linear-gradient(to bottom, #1c1815, #0a0807);
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .altar-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .action-btn {
            background: #d35400;
            color: white;
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.4);
            margin-bottom: 20px;
        }
        .action-btn:hover {
            background: #e67e22;
        }
        .action-btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
        }
        .result-box {
            background: #222;
            border-left: 4px solid #ffcc00;
            padding: 15px;
            border-radius: 4px;
            text-align: left;
            min-height: 120px;
            line-height: 1.6;
            font-size: 14px;
        }
        .result-title {
            font-weight: bold;
            color: #ffcc00;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .cta-btn {
            display: block;
            margin-top: 20px;
            background: #c0392b;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .cta-btn:hover {
            background: #e74c3c;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>오행전설 : 디지털 산신각</h1>
    <div class="subtitle">황토고원 절벽 틈새, 정성스레 향을 피우는 공간</div>

    <!-- 제단 영역 -->
    <div class="altar-box" id="altar-container">
        <video id="altar-video" muted playsinline>
            <source src="altar.mp4" type="video/mp4">
            동영상을 지원하지 않는 브라우저입니다.
        </video>
    </div>

    <!-- 향 피우기 액션 버튼 -->
    <button class="action-btn" id="incense-btn" onclick="burnIncense()">산신 제단에 향 피우기 올리기</button>

    <!-- 결과 출력 영역 (덕담) -->
    <div class="result-box" id="result-area">
        <div class="result-title">산신할아버지의 공수</div>
        <div id="result-text">제단 앞에 정좌하고 향을 피워 올리면 산신의 깊은 말씀이 강림합니다.</div>
    </div>

    <!-- 작가님 유튜브 채널 연결 버튼 -->
    <a href="https://youtube.com/channel/UC19D_0wmj0BeSgRG3vdMsoQ?si=1UrtgWGpSbSWyVum" target="_blank" class="cta-btn">이 기운을 품고 전설 속으로 가기 (YouTube)</a>
</div>

<script>
    // 1. 확장된 고대 판타지 분위기의 덕담 도입부 (총 10개)
    const 덕담도입부 = [
        "깊은 산속 자욱한 안개를 뚫고 마침내 이곳에 닿았구나.",
        "탁한 기운을 깊이 털어내고 정갈한 마음으로 제단에 섰으니,",
        "사방이 꽉 막힌 황토고원의 매서운 칼바람 속에서도,",
        "네가 품은 그릇의 깊이가 비로소 빛을 발할 때가 되었느니라.",
        "칠흑 같은 밤을 건너와 백색 영물의 울음소리를 듣고 찾아왔으니,",
        "흐트러진 호흡을 가다듬고 오행의 기운을 온전히 받아들일 지어다.",
        "스스로의 한계를 시험하던 험난한 고비를 지나 비로소 정면에 섰도다.",
        "대지의 맥동이 거칠게 요동치는 이 순간, 네 안의 불꽃이 깨어나는구나.",
        "지나간 낡은 미련을 모두 태워버릴 정성스러운 향이 피어오르니,",
        "보이지 않는 운명의 문턱에서 산신이 너의 발걸음을 주시하고 있느니라."
    ];

    // 2. 확장된 묵직하고 실천적인 덕담 본문 (총 10개)
    const 덕담본문 = [
        "지나간 낡은 집착과 미련은 과감하게 끊어내고 완전히 새로운 판을 짜도록 하라.",
        "조급하게 마음을 먹지 말고 깊은 우물물처럼 속을 차분히 채우며 때를 기다려라.",
        "남들이 가지 않는 험준한 황무지일지라도 네가 디디는 그 발걸음이 곧 길이 되리라.",
        "흐트러진 집중을 단단히 바로잡고 네 안의 날카로운 결단과 직관을 믿어라.",
        "주변의 헛된 소음에 귀를 닫고 네가 걸어가는 서사의 중심을 굳건히 지켜라.",
        "작은 성취나 일시적인 역경에 흔들리지 말고 거대한 흐름 속에서 대국을 보라.",
        "오래도록 막혀 있던 답답한 일들은 뜻밖의 방향에서 찾아오는 기회로 풀리게 되리라.",
        "스스로의 잠재운 역량을 의심하지 말고 이번 판을 주도적으로 이끌어 나가라.",
        "잠시 멈춰 서서 지나온 발자취를 돌아보면, 그 속에 이미 해결의 실마리가 있느니라.",
        "예상치 못한 변화가 다가오더라도 당황하지 말고 흐름에 유연하게 몸을 맡겨라."
    ];

    // 3. 확장된 강력한 결말 및 덕담 조각 (총 10개)
    const 덕담결말 = [
        "머지않아 구름이 걷히고 거대한 태양이 네 앞길을 찬란하게 비출 것이다.",
        "호랑이의 맹렬한 기운이 네 등 뒤를 든든히 지킬 터이니 거침없이 나아가라.",
        "오늘 흘린 진지한 노력이 마침내 네가 그려온 전설의 서사를 완성할 페달이 되리라.",
        "산신의 가호가 언제나 너와 함께할지니, 어떤 시련이 와도 결코 흔들리지 말라.",
        "막혀 있던 운의 흐름이 순풍을 만난 듯 거침없이 트이며 비상하기 시작하리라.",
        "내면의 단단한 결기가 마침내 주위의 모든 상황을 네게 유리한 판으로 이끌어주리라.",
        "뜻밖의 행운과 든든한 귀인이 네 곁에서 발걸음을 맞추어 도와줄 것이다.",
        "시간이 지날수록 더 큰 빛을 발하며 네가 바라는 목표에 성큼 다가서리라.",
        "어둠이 물러가고 새로운 여명의 빛이 터져 나오듯 순식간에 기회가 열릴 것이다.",
        "오늘 네가 올린 정성이 마침내 하늘과 땅을 움직이는 거대한 불꽃이 되리라."
    ];

    function burnIncense() {
        const btn = document.getElementById('incense-btn');
        const resultText = document.getElementById('result-text');
        const video = document.getElementById('altar-video');
        
        btn.disabled = true;
        btn.innerText = "향이 타오르며 산신의 기운이 모이는 중...";

        // 버튼을 누르는 순간 영상 재생
        video.currentTime = 0;
        video.play();

        // 1.5초 뒤에 무한 조합 덕담 텍스트 띄우기 (랜덤성 대폭 강화)
        setTimeout(() => {
            const now = new Date();
            const seed = now.getTime() + Math.floor(Math.random() * 10000);
            
            const r1 = seed % 덕담도입부.length;
            const r2 = Math.floor(seed / 7) % 덕담본문.length;
            const r3 = Math.floor(seed / 13) % 덕담결말.length;

            const 조합된덕담 = `${덕담도입부[r1]}<br><br>${덕담본문[r2]}<br><br>${덕담결말[r3]}`;

            resultText.innerHTML = `<span style="color:#ff9900; font-weight:bold;">[향이 타오른 자리의 공수]</span><br><br>${조합된덕담}`;
            
            btn.innerText = "참배 완료 (다시 하려면 새로고침)";
        }, 1500);
    }
</script>

</body>
</html>
